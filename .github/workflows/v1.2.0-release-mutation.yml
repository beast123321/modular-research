name: v1.2.0 offline release finalizer

on:
  push:
    branches:
      - release/v1.2.0-tiktok-provider-verification
    paths:
      - .github/v1.2.0-release-mutation-trigger

permissions:
  contents: write

jobs:
  finalize-release-metadata:
    if: endsWith(github.event.head_commit.message, 'finalize v1.2.0 release metadata')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-tiktok-provider-verification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          root = Path('.')
          version_path = root / 'VERSION'
          readme_path = root / 'README.md'
          release_path = root / 'docs' / 'RELEASE.md'
          registry_path = root / 'references' / 'endpoints.json'
          manifest_path = root / 'references' / 'verifications' / 'tiktok-provider-verification-v1.2.0.json'
          expected = {'ad_percentile','ads_detail','ads_search','creator_posts','creator_search_insights','creator_search_insights_trend','top_ads_spotlight','top_contents_list','video_comments','video_detail','video_metrics','video_search'}
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['validation_calls'] == {'attempted': 12, 'succeeded': 12, 'failed': 0}
          assert manifest['pricing_basis'] == 'provider_default'
          assert set(manifest['promoted_capabilities']) == expected
          assert manifest['non_promoted_capabilities'] == []
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          semantic_before = json.dumps(registry, ensure_ascii=False, sort_keys=True)
          tiktok = [e for e in registry['endpoints'] if e.get('provider') == 'tikhub' and e.get('platform') == 'tiktok']
          assert {e['capability'] for e in tiktok if e.get('status') == 'live_verified'} == expected
          for entry in tiktok:
              if entry['capability'] in expected:
                  assert entry['unit_price_usd'] is None
                  assert entry['verified_at'] == '2026-08-27'
                  assert entry['verification_basis'] == 'real_provider_response'
                  assert entry['validation_calls'] == {'attempted': 12, 'succeeded': 12, 'failed': 0}
                  assert entry['normalizer_validation'] == 'PASS'
              else:
                  assert entry['status'] == 'documented'
          lines = ['{', '  "schema_version": ' + json.dumps(registry['schema_version'], ensure_ascii=False) + ',', '  "endpoints": [']
          for index, entry in enumerate(registry['endpoints']):
              suffix = ',' if index + 1 < len(registry['endpoints']) else ''
              lines.append('    ' + json.dumps(entry, ensure_ascii=False, separators=(',', ':')) + suffix)
          lines.append('  ],')
          lines.append('  "providers": {')
          providers = list(registry['providers'].items())
          for p_index, (provider_name, provider) in enumerate(providers):
              lines.append('    ' + json.dumps(provider_name) + ': {')
              items = list(provider.items())
              for i, (key, value) in enumerate(items):
                  comma = ',' if i + 1 < len(items) else ''
                  rendered = json.dumps(value, ensure_ascii=False, separators=(',', ':')) if isinstance(value, dict) else json.dumps(value, ensure_ascii=False)
                  lines.append('      ' + json.dumps(key) + ': ' + rendered + comma)
              lines.append('    }' + (',' if p_index + 1 < len(providers) else ''))
          lines.extend(['  }', '}'])
          registry_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          assert json.dumps(json.loads(registry_path.read_text(encoding='utf-8')), ensure_ascii=False, sort_keys=True) == semantic_before
          release_status = base64.b64decode('').decode('utf-8')
          tiktok_section = base64.b64decode('').decode('utf-8')
          release_doc = base64.b64decode('').decode('utf-8')
          readme = readme_path.read_text(encoding='utf-8')
          assert readme.count('## 发布状态\n') == 1
          prefix, rest = readme.split('## 发布状态\n', 1)
          _, tail = rest.split('\n## 安装\n', 1)
          readme = prefix + release_status + '\n## 安装\n' + tail
          assert readme.count('### TikTok\n') == 1
          prefix, rest = readme.split('### TikTok\n', 1)
          _, tail = rest.split('\n## 输出\n', 1)
          readme = prefix + tiktok_section + '\n## 输出\n' + tail
          phase11 = 'PYTHONPATH=scripts python -m unittest scripts/test_phase11_provider_verification.py\n'
          assert phase11 in readme
          readme = readme.replace(phase11, 'PYTHONPATH=scripts python -m unittest scripts/test_phase13_tiktok_release.py\n' + phase11, 1)
          readme_path.write_text(readme, encoding='utf-8')
          release_path.write_text(release_doc, encoding='utf-8')
          version_path.write_text('1.2.0\n', encoding='utf-8')
          assert version_path.read_text(encoding='utf-8').strip() == '1.2.0'
          assert '当前版本：`1.2.0`' in readme_path.read_text(encoding='utf-8')
          assert 'provider-default' in readme_path.read_text(encoding='utf-8')
          assert '# Modular Research v1.2.0 发布说明' in release_path.read_text(encoding='utf-8')
          PY
      - name: Commit release metadata only
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 -uall
          changed="$(git status --porcelain=v1 -uall | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' README.md VERSION docs/RELEASE.md references/endpoints.json | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md VERSION docs/RELEASE.md references/endpoints.json
          git commit -m 'release: finalize v1.2.0 TikTok provider verification'
          git push origin HEAD:release/v1.2.0-tiktok-provider-verification
