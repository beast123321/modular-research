name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run complete offline suite
        env:
          PYTHONPATH: scripts
        run: >-
          python -m unittest
          scripts/test_phase8.py
          scripts/test_phase7.py
          scripts/test_phase6.py
          scripts/test_phase5.py
          scripts/test_phase4.py
          scripts/test_phase3.py
          scripts/test_phase2.py
          scripts/test_foundation.py
          scripts/test_skill.py
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Public release audit
        run: python scripts/release_check.py --root .
      - name: Core environment check
        run: python scripts/check_environment.py --mode core
