name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run V2 and foundation unittest suite
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          for test_file in \
            scripts/test_phase14_workbench_bundle.py \
            scripts/test_phase13_tiktok_release.py \
            scripts/test_phase12_tiktok_provider_verification.py \
            scripts/test_phase12_provider_integrity.py \
            scripts/test_phase12_workbench.py \
            scripts/test_phase12_http.py \
            scripts/test_phase11_provider_verification.py \
            scripts/test_phase10_live_validation.py \
            scripts/test_phase9_budget.py \
            scripts/test_phase9_cli.py \
            scripts/test_phase9.py \
            scripts/test_phase8.py \
            scripts/test_phase7.py \
            scripts/test_phase6.py \
            scripts/test_phase5.py \
            scripts/test_phase4.py \
            scripts/test_phase3.py \
            scripts/test_phase2.py \
            scripts/test_foundation.py
          do
            echo "=== RUN ${test_file} ==="
            python -m unittest "${test_file}"
          done
      - name: Run legacy regression suite
        run: python scripts/test_skill.py
      - name: Compile Python sources
        run: python -m compileall -q scripts web
      - name: Public release audit
        run: python scripts/release_check.py --root .
      - name: Core environment check
        run: python scripts/check_environment.py --mode core

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build
