name: frontend-bootstrap-lock

on:
  push:
    branches: ["feat/research-workbench-v1.2.0"]
    paths:
      - "web/frontend/package.json"

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate package lock
        working-directory: web/frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(workbench): lock frontend dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
